server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # IP real del visitante cuando llega por Cloudflare Tunnel
    # (sin esto, todos los visitantes comparten el límite de intentos de login)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API solo es accesible a través de Nginx (el puerto 3001 no se publica)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de React Router
    location / {
        try_files $uri /index.html;
    }
}
